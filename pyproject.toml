[project]
name = "qbtools"
version = "0.1.0"
description = "Bulk-edit qBittorrent torrents (trackers, tags, category, save path, name) over the Web API, filtered by category / tag / state."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["qbittorrent-api>=2024.1.58", "typer", "rich"]

[project.scripts]
qbtools = "qbtools.cli:app"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
